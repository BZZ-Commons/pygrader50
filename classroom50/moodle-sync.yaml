name: Moodle Sync

# Gehört ins classroom50-Config-Repo (.github/workflows/moodle-sync.yaml).
# Überträgt die in scores.json gesammelten Punkte nach Moodle — manuell per
# Knopfdruck oder nachts. Der Nachtlauf stösst "Collect Scores" selbst an und
# wartet darauf, statt sich auf einen Cron dort zu verlassen.
#
# Der Moodle-Token liegt bewusst HIER und nicht in den Studi-Repos: dort könnte
# ihn jede*r Studierende mit einem eigenen Workflow auslesen und damit beliebige
# Noten setzen.
#
# Warum der Übertragungs-Zustand */moodle-state.json so geschützt wird: geht er
# verloren, schickt der nächste Lauf bereits übertragene Noten erneut und
# überschreibt damit eine in Moodle von Hand korrigierte Note wieder. Zwei Racer
# können ihn kosten, siehe "concurrency" (Racer 1) und "Zustand committen"
# (Racer 2).
#
# Die Datei ist classroom-neutral: ein Config-Repo mit mehreren Klassen braucht
# keine zweite Kopie. Welche Classrooms angefasst werden, muss aber ausgesprochen
# werden — entweder "classroom" oder der Schalter "all_classrooms". Ein leeres
# Feld heisst NICHT mehr "alle": GitHub Actions liefert eine nicht ausgefüllte
# Eingabe als leeren String, ununterscheidbar von einer bewusst geleerten, und
# der weiteste Radius darf nicht der Vorgabezustand sein. pygrader50 löst den
# Scope fail-closed auf und bricht ohne Angabe mit Exit 2 ab.
#
# Secrets/Variablen im classroom50-Repo:
#   secrets.MOODLE_TOKEN   Webservice-Token
#   vars.MOODLE_URL        Basis-URL der Moodle-Instanz
#   vars.MOODLE_FUNCTION   optional, Vorgabe mod_externalassignment_update_grade

on:
  workflow_dispatch:
    inputs:
      classroom:
        description: "Classroom (Ordner im Config-Repo) — leer heisst NICHT alle"
        required: false
      all_classrooms:
        description: "Alle Classrooms des Config-Repos übertragen"
        type: boolean
        default: false
      assignment:
        description: "Nur dieses Assignment (leer = alle)"
        required: false
      user:
        description: "Nur dieser GitHub-Login (leer = alle)"
        required: false
      dry_run:
        description: "Nur anzeigen, nichts an Moodle senden"
        type: boolean
        default: false
      force:
        description: "Auch unveränderte Noten erneut übertragen"
        type: boolean
        default: false
  # Nachtlauf, 03:00 Zürich. Sammelt selbst ein, siehe "Punkte einsammeln".
  #
  # Cron ist bei GitHub immer UTC und kennt keine Sommerzeit. 00:57 UTC ist
  # 02:57 Zürich (CEST); mit dem üblichen Warteschlangen-Verzug von GitHub
  # (6–15 min, gemessen) startet der Lauf also kurz nach 03:00. Ab der
  # Umstellung Ende Oktober (CET) liegt dieselbe Zeile eine Stunde früher,
  # kurz nach 02:00. Bewusst in Kauf genommen: an der genauen Stunde hängt
  # nichts, und zwei Crons mit Zeitzonen-Wächter kosteten jede Nacht einen
  # zweiten, leeren Lauf.
  schedule:
    - cron: "57 0 * * *"

permissions:
  contents: write       # schreibt den Übertragungs-Zustand zurück

# Racer 1: dieser Workflow gegen sich selbst. Eine Gruppe für alle Läufe, nicht
# eine je Classroom — sie mutieren dieselbe Ablage */moodle-state.json im selben
# Repo und pushen sie zurück; scope-abhängige Gruppen liessen den nächtlichen und
# einen classroom-weiten Lauf gleichzeitig laufen. Folge eines verlorenen
# Zustands siehe Kopfkommentar.
#
# Was das kostet, genau gesagt: GitHub hält je Gruppe nur *einen* wartenden Lauf.
# Läuft der Nachtlauf (bis ~25 min, inkl. Sammeln) und werden zwei manuelle
# Läufe angestossen, wird der erste wartende **abgebrochen**, nicht eingereiht.
# Das ist ungefährlich — ein abgebrochener wartender Lauf hat nie etwas gesendet
# — aber er verschwindet still. Wer einen manuellen Lauf vermisst, startet ihn
# erneut. `cancel-in-progress: false` schützt nur den *laufenden*.
concurrency:
  group: moodle-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # "Collect Scores" hat seit gh-teacher v1.32.0 keinen eigenen Cron mehr
      # (Upstream #670), und ein von Hand nachgetragener würde beim nächsten
      # Skeleton-Refresh wieder verschwinden. Der Nachtlauf stösst das Sammeln
      # deshalb hier an und wartet, bevor er scores.json liest — sonst überträgt
      # er den Stand des Vortags, ohne dass etwas rot wird.
      #
      # Nicht mit github.token: von GITHUB_TOKEN ausgelöste Events starten keinen
      # neuen Workflow-Run. Der Service-Token braucht Actions: Read and write.
      #
      # Scheitert das Anstossen oder das Sammeln, läuft der Übertrag mit dem
      # vorhandenen Stand weiter — alte Punkte sind besser als gar keine.
      - name: Punkte einsammeln
        if: github.event_name == 'schedule'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.CLASSROOM50_SERVICE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          if ! gh workflow run collect-scores.yaml --repo "$REPO"; then
            echo "::warning::\"Collect Scores\" liess sich nicht anstossen — übertrage den vorhandenen Stand."
            exit 0
          fi

          # Die Run-ID erscheint erst ein paar Sekunden nach dem Dispatch.
          RUN_ID=""
          for _ in $(seq 1 12); do
            sleep 5
            RUN_ID=$(gh run list --repo "$REPO" --workflow collect-scores.yaml \
                       --event workflow_dispatch --limit 5 \
                       --json databaseId,status \
                       --jq 'map(select(.status != "completed")) | first | .databaseId // empty')
            [ -n "$RUN_ID" ] && break
          done

          if [ -z "$RUN_ID" ]; then
            echo "::warning::Kein laufender Collect-Run gefunden — übertrage den vorhandenen Stand."
            exit 0
          fi

          if ! gh run watch "$RUN_ID" --repo "$REPO" --interval 15 --exit-status; then
            echo "::warning::\"Collect Scores\" ist gescheitert — übertrage den vorhandenen Stand."
          fi

      # Nach dem Sammeln auschecken: "Collect Scores" committet scores.json nach
      # main, ein früherer Checkout hätte den alten Stand.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Dieser Pin und der in bootstrap/autograder.py dürfen auseinanderlaufen:
      # sie sind zwei getrennte Rollout-Sperren. Diese hier zieht mit jeder
      # Änderung an moodle.py mit; die in bootstrap nur mit einer Änderung am
      # Bewertungspfad, weil sie ein `set-default` und damit einen Eingriff in
      # laufende Klassen kostet. moodle.py läuft im Bewertungsjob gar nicht.
      - name: Install pygrader50
        run: pip install "pygrader50 @ git+https://github.com/BZZ-Commons/pygrader50@v2.3.0"

      - name: Übertragen
        env:
          MOODLE_URL: ${{ vars.MOODLE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          MOODLE_FUNCTION: ${{ vars.MOODLE_FUNCTION }}
          # Liest die Release-Bodies der Studi-Repos für den Feedback-Text.
          GH_TOKEN: ${{ secrets.CLASSROOM50_SERVICE_TOKEN }}
          CLASSROOM: ${{ github.event.inputs.classroom }}
          # Die eine Entscheidung, die hier bleibt — und zwar die weitende:
          # "Nachtlauf heisst alle Classrooms" ist Deployment-Politik dieses
          # Repos, nicht Programmlogik, und kann deshalb nicht nach Python.
          # Alles andere reicht der Step nur durch.
          # `== 'true'` explizit: `github.event.inputs.*` liefert Strings, und
          # GitHub castet jeden nicht-leeren String zu true — ohne den Vergleich
          # wäre die abgewählte Checkbox ("false") truthy.
          ALL_CLASSROOMS: ${{ github.event_name == 'schedule' || github.event.inputs.all_classrooms == 'true' }}
          ASSIGNMENT: ${{ github.event.inputs.assignment }}
          USER_FILTER: ${{ github.event.inputs.user }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -uo pipefail

          # Die Shell verengt hier nur noch, sie entscheidet nicht: welche
          # Classrooms angefasst werden, löst pygrader50 auf — dort ist die Regel
          # testbar und existiert einmal statt in jeder Kopie dieses Workflows.
          # Kommt weder --classroom noch --all-classrooms an, bricht es mit
          # Exit 2 ab, statt alles zu übertragen.
          #
          # Bewusst if-Blöcke statt `[ … ] && ARGS+=…`: unter `set -e` würde ein
          # fehlschlagender letzter Test den Step rot färben. Und das Array wird
          # nicht leer angelegt — `"${ARGS[@]}"` bräuchte sonst bash >= 4.4.
          ARGS=("--config-repo" ".")
          if [ "${ALL_CLASSROOMS:-false}" = "true" ]; then ARGS+=("--all-classrooms"); fi
          if [ -n "${CLASSROOM:-}" ];   then ARGS+=("--classroom" "$CLASSROOM"); fi
          if [ -n "${ASSIGNMENT:-}" ];  then ARGS+=("--assignment" "$ASSIGNMENT"); fi
          if [ -n "${USER_FILTER:-}" ]; then ARGS+=("--user" "$USER_FILTER"); fi
          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS+=("--dry-run"); fi
          if [ "${FORCE:-false}" = "true" ];   then ARGS+=("--force"); fi

          # Ein gescheitertes Classroom stoppt die übrigen nicht; der Exit-Code
          # wird in pygrader50 über alle Classrooms zusammengefasst.
          python -m pygrader50.moodle "${ARGS[@]}"

      - name: Zustand committen
        # always(): auch wenn einzelne Übertragungen scheiterten, sollen die
        # erfolgreichen nicht beim nächsten Lauf erneut geschickt werden.
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          BOT=(-c user.name=classroom50-bot -c user.email=bot@classroom50)

          if [ -z "$(git status --porcelain '*/moodle-state.json' 2>/dev/null)" ]; then
            echo "keine Änderungen am Übertragungs-Zustand"
            exit 0
          fi

          git add '*/moodle-state.json'
          git "${BOT[@]}" commit -m "[Moodle] Übertragungs-Zustand aktualisiert"

          # Racer 2: "Collect Scores", ein anderer Workflow, der scores.json
          # ebenfalls nach main committet. Die concurrency-Gruppe erreicht ihn
          # nicht — er ist eine Skeleton-Datei und verlöre jeden dort
          # nachgetragenen Schlüssel beim nächsten Dashboard-Refresh. Läuft er,
          # während dieser Job überträgt, ist unser Checkout veraltet und
          # `git push` scheitert non-fast-forward: unter `set -e` mit verlorenem
          # Zustand (Folge siehe Kopfkommentar). Deshalb rebasen und erneut.
          #
          # Zwei Rebases, drei Pushes: der letzte steht ausserhalb der Schleife,
          # weil er rot werden darf.
          # Der Rebase steht bewusst in einem `if`: unter `set -e` würde ein
          # gescheiterter Rebase den Step sofort beenden — mitten in der
          # Schleife, mit halb aufgeräumtem Rebase-Zustand und ungepushtem
          # Commit. Genau der Datenverlust, gegen den die Schleife da ist.
          for attempt in 1 2; do
            if git push; then exit 0; fi
            echo "::warning::Push abgelehnt (Versuch $attempt) — rebase und erneut."
            if ! git "${BOT[@]}" pull --rebase --autostash; then
              git rebase --abort || true
              echo "::error::Rebase gescheitert — der Übertragungs-Zustand bleibt ungepusht."
              echo "::error::Von Hand nachziehen, sonst schickt der nächste Lauf alles erneut."
              exit 1
            fi
          done
          git push
