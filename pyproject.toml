[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pygrader50"
version = "2.0.0"
description = "Autograder engine (pytest + pylint) for Classroom 50"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "BZZ-Commons" }]
dependencies = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "pylint>=3.3",
]

[project.urls]
Homepage = "https://github.com/BZZ-Commons/pygrader50"

[project.scripts]
pygrader50 = "pygrader50.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pygrader50 = ["data/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
